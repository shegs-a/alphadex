# Local development environment for AlphaDex Scout.
# Runs identically on a developer laptop and a small cloud VM (ADR-001).
# Configuration comes from .env (copy from .env.example); no secrets are hard-coded.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphadex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphadex}
      POSTGRES_DB: ${POSTGRES_DB:-alphadex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphadex} -d ${POSTGRES_DB:-alphadex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      # Point the app at the compose database service.
      POSTGRES_USER: ${POSTGRES_USER:-alphadex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphadex}
      POSTGRES_DB: ${POSTGRES_DB:-alphadex}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
